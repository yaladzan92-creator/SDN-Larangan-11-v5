<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#blueGrad)" rx="16"/>
  
  <!-- Decorative Background Circles -->
  <circle cx="400" cy="300" r="220" fill="#bae6fd" opacity="0.3" />
  <circle cx="400" cy="300" r="180" fill="#7dd3fc" opacity="0.2" />
  
  <!-- Education Icon Silhouette (Book and Torch/Star) -->
  <g transform="translate(280, 160)" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Open Book -->
    <path d="M 120 180 C 60 160, 20 180, 20 180 L 20 60 C 20 60, 60 40, 120 60 M 120 180 C 180 160, 220 180, 220 180 L 220 60 C 220 60, 180 40, 120 60" fill="none"/>
    <path d="M 120 60 L 120 180" />
    <path d="M 40 85 C 60 75, 100 75, 100 75" opacity="0.5"/>
    <path d="M 40 115 C 60 105, 100 105, 100 105" opacity="0.5"/>
    <path d="M 40 145 C 60 135, 100 135, 100 135" opacity="0.5"/>
    <path d="M 140 75 C 140 75, 180 75, 200 85" opacity="0.5"/>
    <path d="M 140 105 C 140 105, 180 105, 200 115" opacity="0.5"/>
    <path d="M 140 145 C 140 145, 180 145, 200 155" opacity="0.5"/>
    
    <!-- Academic Hat/Cap above book -->
    <g transform="translate(50, -80)" fill="url(#bookGrad)" stroke="none">
      <polygon points="70,10 130,30 70,50 10,30"/>
      <polygon points="30,37 30,65 70,80 110,65 110,37 70,50" />
      <path d="M 130 30 L 130 70" stroke="#1d4ed8" stroke-width="3" fill="none"/>
      <circle cx="130" cy="70" r="5" fill="#1d4ed8"/>
    </g>
  </g>
  
  <text x="400" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1e3a8a" text-anchor="middle">PROFIL SEKOLAH</text>
  <text x="400" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">Unggul dalam Prestasi, Berkarakter, dan Berbudaya Lingkungan</text>
</svg>
